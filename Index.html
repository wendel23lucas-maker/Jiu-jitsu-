function localISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseISO(s){const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12,0,0)}
function addDays(date,n){let d=parseISO(date);d.setDate(d.getDate()+n);return localISO(d)}
function monday(date){let d=parseISO(date);d.setDate(d.getDate()-((d.getDay()+6)%7));return localISO(d)}
function defaultStart(){const now=localISO(new Date());return new Date().getDay()===0?addDays(now,1):monday(now)}
const today=localISO(new Date());
let storageGood=true;
function initial(){return {version:1,startDate:defaultStart(),days:{},measurements:[]}}
function load(){try{let s=localStorage.getItem(STORAGE);if(!s)return initial();let obj=JSON.parse(s);if(!obj||typeof obj!=='object'||!obj.days||!Array.isArray(obj.measurements))throw Error('Formato');return {...initial(),...obj}}catch(e){storageGood=false;return initial()}}
let db=load(),selected=today,tab='today',expanded={},selectedLift='squat',timer=null,tick=null,toastTimer=null;
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(db));storageGood=true}catch(e){storageGood=false;toast('Não foi possível salvar. Exporte um backup.',true)}}
function dayData(date=selected){if(!db.days[date])db.days[date]={lifts:{},jiu:{},cardio:{},mob:{},gymDone:false,jiuDone:false};return db.days[date]}
function safeDay(date){return db.days[date]||{lifts:{},jiu:{},cardio:{},mob:{}}}
function weekOf(date){let a=parseISO(monday(db.startDate)),b=parseISO(date);return Math.floor((b-a)/86400000/7)+1}
function phase(w){if(w<=0)return {title:'Pré-início',desc:'O programa ainda não começou. Você pode registrar treinos normalmente.',type:'pre'};if(w<=2)return {title:'Adaptação',desc:'Uma série a menos por exercício. Cardio leve, sem intervalos.',type:'adapt'};if(w<=4)return {title:'Construção',desc:'Volume prescrito e 4 intervalos leves a moderadamente intensos no sábado.',type:'build'};if(w===5)return {title:'Deload',desc:'Metade das séries (arredondando para cima), sem intervalos.',type:'deload'};if(w<=8)return {title:'Progressão',desc:'Séries completas e até 6 intervalos no sábado, conforme recuperação.',type:'build'};return {title:'Ciclo concluído',desc:'Continue registrando ou defina uma nova data de início nos ajustes.',type:'after'}}
function nSets(ex,date=selected){let w=weekOf(date),p=phase(w).type;if(p==='adapt')return Math.max(1,ex.sets-1);if(p==='deload')return Math.max(1,Math.ceil(ex.sets/2));return ex.sets}
function weekday(date){return parseISO(date).getDay()}
function dateFull(date){let d=parseISO(date);return `${shortD[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]}`}
function fullDate(date){let d=parseISO(date);return `${d.getDate()} de ${months[d.getMonth()]} de ${d.getFullYear()}`}
function datesWeek(date){let st=monday(date);return Array.from({length:7},(_,i)=>addDays(st,i))}
function weekState(date){let d=safeDay(date),wd=weekday(date);return wd===0?true:wd%2===0?!!d.gymDone:!!d.jiuDone}
function mobilityCount(date){let mob=safeDay(date).mob||{};return mobility.filter(m=>mob[m.id]).length}
function cardioDone(date){return !!safeDay(date).cardio?.done}

function ring(pct){let val=Math.min(100,Math.max(0,pct));return `<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="49" fill="none" stroke="#6a9d9c33" stroke-width="9"/><circle cx="60" cy="60" r="49" fill="none" stroke="#66e5c5" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(2*Math.PI*49*val/100).toFixed(1)} 999"/></svg><div><strong>${Math.round(val)}%</strong><small>da semana</small></div></div>`}
function currentWeekStats(date){let days=datesWeek(date);let gymDone=days.filter(d=>weekday(d)%2===0&&weekday(d)!==0&&safeDay(d).gymDone).length,jiuDone=days.filter(d=>weekday(d)%2===1&&safeDay(d).jiuDone).length,cardio=days.filter(d=>safeDay(d).cardio?.done).length,mobDone=days.filter(d=>mobilityCount(d)===mobility.length).length;return {gymDone,jiuDone,cardio,mobDone,total:gymDone+jiuDone,pct:100*(gymDone+jiuDone)/6}}

function priorLoad(exid,date){let vals=[];Object.entries(db.days).forEach(([dt,v])=>{if(dt>=date)return;let ar=v.lifts?.[exid];if(!Array.isArray(ar))return;ar.forEach(set=>{if(set.done&&num(set.kg)!==null&&String(set.kg)!=='')vals.push({date:dt,kg:set.kg,reps:set.reps})})});vals.sort((a,b)=>b.date.localeCompare(a.date));return vals[0]||null}

function cardioCard(){let wd=weekday(selected),isJiu=wd%2===1,typeofSession=wd===6?'interval':isJiu?'jiu':'zone',d=dayData(),c=d.cardio||{},w=weekOf(selected),interval=wd===6&&w>=3&&w!==5;let target=wd===6?(interval?(w<=4?'4 ciclos de 30s forte / 90s leve':'6 ciclos de 30s forte / 90s leve'):'20 min leve (fase de adaptação/recuperação)'):isJiu?'Jiu já é cardio; extra leve de 8–12 min se recuperar bem':'20–25 min de zona 2';return `<div class="section-head"><h2 class="section-title">Cardio do dia</h2><span class="tag blue">${wd===6&&interval?'INTERVALADO':isJiu?'JIU + OPCIONAL':'ZONA 2'}</span></div><div class="card"><p class="subtext" style="margin:0 0 12px">${target}. ${wd===6&&interval?'Aqueça 5 min, faça os ciclos na bicicleta e desacelere 5 min.':'Ritmo confortável. Nos dias de tatame intenso, evite acumular cardio pesado.'}</p><div class="form-grid"><div><label class="form-label" for="cardioType">Modalidade</label><select id="cardioType" class="form-input" data-field="cardio" data-prop="type"><option value="bike" ${c.type==='bike'?'selected':''}>Bicicleta</option><option value="walk" ${c.type==='walk'?'selected':''}>Caminhada</option><option value="run" ${c.type==='run'?'selected':''}>Corrida</option><option value="jiu" ${c.type==='jiu'||!c.type&&isJiu?'selected':''}>Próprio jiu-jitsu</option><option value="other" ${c.type==='other'?'selected':''}>Outro</option></select></div><div><label class="form-label" for="cardioMin">Duração (min)</label><input id="cardioMin" class="form-input" type="number" min="0" max="300" placeholder="Ex.: 25" value="${x(c.minutes??'')}" data-field="cardio" data-prop="minutes"></div></div><div class="flex-between" style="margin-top:15px"><div><strong style="font-size:12px">Cardio realizado</strong><div class="small-note">Conta para seu histórico semanal.</div></div><input class="check large" type="checkbox" data-field="cardio" data-prop="done" ${c.done?'checked':''} aria-label="Marcar cardio realizado"></div></div>`}
function pageWorkout(){const wd=weekday(selected),s=schedule[wd],d=dayData(),w=weekOf(selected),p=phase(w);let head=`<div class="tab-top"><span class="eyebrow">DIÁRIO DE SESSÕES</span><h1 class="page-title">Treinamento</h1><p class="subtext">Cargas, séries, técnica e condicionamento registrados por data.</p></div>${strip()}`;
if(wd===0)return `${head}<div class="card" style="margin-top:19px"><div class="activity-card"><div class="activity-icon recovery">${ico('heart')}</div><div><h3>Dia de recuperação</h3><p>Mobilidade leve, descanso e sono em dia.</p></div></div><p class="subtext">A evolução acontece também na recuperação. Evite transformar o domingo em mais uma sessão exaustiva.</p><button class="btn btn-primary btn-block" data-action="tab" data-tab="mob">Abrir mobilidade diária</button></div>`;
if(s.kind==='jiu')return `${head}<div class="section-head"><h2 class="section-title">Sessão de jiu-jitsu</h2><span class="tag blue">SEG • QUA • SEX</span></div><div class="card"><div class="flex-between"><div><strong>Registro do tatame</strong><p class="subtext" style="margin:5px 0 0">Acompanhe volume, intensidade e aprendizado.</p></div><div class="activity-icon">${ico('activity')}</div></div><div class="divider"></div><div class="form-grid three"><div><label class="form-label" for="jiuMin">Duração (min)</label><input class="form-input" id="jiuMin" type="number" min="0" max="300" placeholder="60" value="${x(d.jiu.minutes??'')}" data-field="jiu" data-prop="minutes"></div><div><label class="form-label" for="jiuRolas">Rolas / rounds</label><input class="form-input" id="jiuRolas" type="number" min="0" max="50" placeholder="4" value="${x(d.jiu.rounds??'')}" data-field="jiu" data-prop="rounds"></div><div><label class="form-label" for="jiuRpe">Esforço (0–10)</label><select id="jiuRpe" class="form-input" data-field="jiu" data-prop="rpe"><option value="">Escolher</option>${Array.from({length:11},(_,v)=>`<option value="${v}" ${String(d.jiu.rpe??'')===String(v)?'selected':''}>${v}</option>`).join('')}</select></div></div><div style="margin-top:14px"><label class="form-label" for="jiuFocus">Foco técnico do dia</label><input class="form-input" id="jiuFocus" maxlength="180" placeholder="Ex.: saída de montada, raspagem, passagem..." value="${x(d.jiu.focus??'')}" data-field="jiu" data-prop="focus"></div><div style="margin-top:14px"><label class="form-label" for="jiuNotes">Notas sobre o treino</label><textarea class="form-input" id="jiuNotes" rows="3" placeholder="O que funcionou? Onde perdi o gás? Como estava minha pegada?" data-field="jiu" data-prop="notes">${x(d.jiu.notes??'')}</textarea></div><button class="btn ${d.jiuDone?'btn-secondary':'btn-primary'} btn-block" style="margin-top:15px" data-action="complete-jiu">${ico('check',17)} ${d.jiuDone?'Treino concluído ✓ (toque para desfazer)':'Concluir sessão de jiu-jitsu'}</button></div>${cardioCard()}<div class="message" style="margin-top:14px">O próprio jiu-jitsu conta como condicionamento. Faça cardio extra leve apenas quando não prejudicar sua recuperação para o treino seguinte.</div>`;
let g=gym[wd],exs=g.ex,doneSets=0,totalSets=0;exs.forEach(ex=>{let ar=liftSets(selected,ex);totalSets+=nSets(ex);doneSets+=ar.slice(0,nSets(ex)).filter(z=>z.done).length});return `${head}<div class="section-head"><div><h2 class="section-title">${g.label} <span class="tag amber">${p.title}</span></h2><p class="subtext">${g.purpose} • ${g.duration}</p></div><span class="badge-count">${doneSets}/${totalSets} séries</span></div><div class="card soft" style="margin-bottom:14px"><div class="flex-between"><strong style="font-size:12px">Seu progresso nesta sessão</strong><span class="text-green micro">${Math.round(doneSets/Math.max(1,totalSets)*100)}%</span></div><div class="mini-progress"><span style="width:${100*doneSets/Math.max(1,totalSets)}%"></span></div><p class="small-note" style="margin:10px 0 0">${p.desc} • Deixe cerca de 2 repetições de reserva nos exercícios de força.</p></div>${exs.map(workEx).join('')}<button class="btn ${d.gymDone?'btn-secondary':'btn-primary'} btn-block" style="margin:14px 0" data-action="complete-gym">${ico('check',17)} ${d.gymDone?'Musculação concluída ✓ (toque para desfazer)':'Finalizar treino de musculação'}</button>${cardioCard()}<p class="footnote">Para exercícios com halteres, registre a carga de cada halter. Nos exercícios por tempo ou distância, use o campo “Reps / seg / m” para segundos ou metros.</p>`}
function pageMob(){let c=mobilityCount(selected);return `<div class="tab-top"><span class="eyebrow">RECUPERAÇÃO ATIVA</span><h1 class="page-title">Mobilidade diária</h1><p class="subtext">12–15 minutos por dia • quadril, coluna, tornozelo, ombros e punhos.</p></div>${strip()}<div class="card" style="margin-top:16px"><div class="flex-between"><div><span class="eyebrow">ROTINA DO DIA</span><h2 class="section-title" style="margin-top:7px">${c} de ${mobility.length} movimentos</h2></div><span class="badge-count">${Math.round(c/mobility.length*100)}%</span></div><div class="mini-progress"><span style="width:${100*c/mobility.length}%"></span></div><div class="btn-wrap" style="margin-top:14px"><button class="btn btn-small btn-secondary" data-action="all-mob">${ico('check',15)} Concluir todos</button><button class="btn btn-small btn-outline" data-action="clear-mob">Desmarcar</button></div></div><div class="section-head"><h2 class="section-title">Sequência completa</h2><span class="tag">Sem dor • controle</span></div><div class="card">${mobility.map((m,i)=>`<div class="mob-row"><div class="mob-number">${String(i+1).padStart(2,'0')}</div><div class="mob-main"><strong>${x(m.name)}</strong><small>${x(m.duration)} • ${x(m.why)}</small><details style="margin-top:6px"><summary class="small-note" style="cursor:pointer;color:var(--mint)">Como executar</summary><p class="small-note" style="margin:6px 0 0">${x(m.how)}</p></details></div><div class="mob-end"><button class="btn btn-small btn-outline" data-action="timer" data-secs="${m.sec}" data-label="${x(m.name)}" aria-label="Iniciar temporizador de ${x(m.name)}">${ico('clock',14)}</button><input type="checkbox" class="check large" data-field="mob" data-id="${m.id}" ${safeDay(selected).mob?.[m.id]?'checked':''} aria-label="Concluir ${x(m.name)}"></div></div>`).join('')}</div><div class="message" style="margin-top:14px">Antes de treinar: faça movimentos dinâmicos e leves. Alongamentos estáticos mais longos ficam melhor após a sessão. Nada de forçar a amplitude com dor.</div>`}
function weeklyStats(i){let start=addDays(db.startDate,(i-1)*7),dates=Array.from({length:7},(_,d)=>addDays(start,d));let gymDone=dates.filter(d=>[2,4,6].includes(weekday(d))&&safeDay(d).gymDone).length,jiuDone=dates.filter(d=>[1,3,5].includes(weekday(d))&&safeDay(d).jiuDone).length,mob=dates.filter(d=>mobilityCount(d)===mobility.length).length,cardio=dates.filter(d=>safeDay(d).cardio?.done).length;return{gymDone,jiuDone,mob,cardio,done:gymDone+jiuDone}}
function chartData(exid){let values=[];Object.entries(db.days).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([date,d])=>{let ar=d.lifts?.[exid];if(!Array.isArray(ar))return;let v=ar.filter(s=>s.done&&String(s.kg)!=='').map(s=>num(s.kg)).filter(n=>n!==null);if(v.length)values.push({date,value:Math.max(...v)})});return values}
function svgChart(points,label){if(!points.length)return `<div class="empty">Ainda não há registros suficientes.<br>Marque as séries concluídas com carga para visualizar sua evolução.</div>`;let W=500,H=175,pl=38,pr=12,pt=14,pb=29,vals=points.map(p=>p.value),min=Math.min(...vals),max=Math.max(...vals);let spread=max-min;let ymin=Math.max(0,min-(spread||Math.max(1,max*.1))*.35),ymax=max+(spread||Math.max(1,max*.1))*.35;if(ymax===ymin)ymax=ymin+1;let xx=i=>pl+(W-pl-pr)*(points.length===1?.5:i/(points.length-1)),yy=v=>H-pb-(v-ymin)/(ymax-ymin)*(H-pt-pb);let poly=points.map((p,i)=>`${xx(i)},${yy(p.value)}`).join(' ');let t0=points[0].date,t1=points[points.length-1].date;return `<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ${x(label)}: ${points.length} registros"><defs><linearGradient id="areaGraph" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#6deac1" stop-opacity=".27"/><stop offset="100%" stop-color="#6deac1" stop-opacity="0"/></linearGradient></defs>${Array.from({length:4},(_,i)=>{let y=pt+i*(H-pt-pb)/3;let v=ymax-i*(ymax-ymin)/3;return `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#324052" stroke-dasharray="3 5"/><text x="1" y="${y+4}">${Math.round(v)}</text>`}).join('')}<polygon points="${pl},${H-pb} ${poly} ${xx(points.length-1)},${H-pb}" fill="url(#areaGraph)"/><polyline points="${poly}" fill="none" stroke="#66e5c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${points.map((p,i)=>`<circle cx="${xx(i)}" cy="${yy(p.value)}" r="4" fill="#0a2224" stroke="#66e5c5" stroke-width="2"/>`).join('')}<text x="${pl}" y="${H-6}">${dateFull(t0)}</text><text x="${W-pr}" y="${H-6}" text-anchor="end">${dateFull(t1)}</text></svg>`}
function pageProgress(){let allWorkout=Object.entries(db.days).filter(([date,d])=>d.gymDone||d.jiuDone);let totalGym=allWorkout.filter(([date,d])=>d.gymDone).length,totalJiu=allWorkout.filter(([date,d])=>d.jiuDone).length,totalCardio=Object.values(db.days).filter(d=>d.cardio?.done).length,options=Object.values(gym).flatMap(g=>g.ex);let ex=options.find(e=>e.id===selectedLift)||options[0],data=chartData(ex.id),m=[...db.measurements].sort((a,b)=>b.date.localeCompare(a.date));let lastMeasure=m[0];return `<div class="tab-top"><span class="eyebrow">CONTROLE DE EVOLUÇÃO</span><h1 class="page-title">Resultados reais.</h1><p class="subtext">Acompanhe constância, desempenho e medidas ao longo das 8 semanas.</p></div><div class="grid-3"><div class="card stat"><div class="stat-label">Musculação</div><div class="stat-value">${totalGym}</div><div class="stat-desc">sessões feitas</div></div><div class="card stat"><div class="stat-label">Jiu-jitsu</div><div class="stat-value">${totalJiu}</div><div class="stat-desc">sessões feitas</div></div><div class="card stat"><div class="stat-label">Cardio</div><div class="stat-value">${totalCardio}</div><div class="stat-desc">registros</div></div></div><div class="section-head"><h2 class="section-title">Meu ciclo de 8 semanas</h2></div><div class="week-progress">${Array.from({length:8},(_,i)=>{let w=i+1,stat=weeklyStats(w);return `<button class="week-box ${w===weekOf(selected)?'active':''} ${stat.done===6?'done':''}" data-action="go-week" data-week="${w}"><strong>${w}</strong><small>${stat.done}/6</small><span><em style="width:${stat.done/6*100}%"></em></span></button>`}).join('')}</div><div class="section-head"><h2 class="section-title">Força — histórico de carga</h2></div><div class="card"><label class="form-label" for="liftSelect">Escolha o exercício</label><select class="form-input" id="liftSelect" data-action="select-lift">${options.map(item=>`<option value="${item.id}" ${selectedLift===item.id?'selected':''}>${x(item.name)}</option>`).join('')}</select><div style="margin-top:13px">${svgChart(data,ex.name)}</div>${data.length?`<div class="flex-between"><span class="small-note">Primeira carga: ${fmt(data[0].value)} kg</span><strong style="font-size:13px;color:var(--mint)">Atual: ${fmt(data[data.length-1].value)} kg</strong></div>`:''}<p class="small-note">Cargas registradas em séries concluídas; compare exercícios e técnicas equivalentes.</p></div><div class="section-head"><h2 class="section-title">Peso e cintura</h2></div><div class="card"><div class="form-grid"><div><label class="form-label" for="bodyWeight">Peso (kg)</label><input id="bodyWeight" class="form-input" inputmode="decimal" placeholder="Ex.: 100,5"></div><div><label class="form-label" for="waist">Cintura (cm)</label><input id="waist" class="form-input" inputmode="decimal" placeholder="Ex.: 95"></div></div><div class="form-grid" style="margin-top:11px"><div><label class="form-label" for="measureDate">Data da medida</label><input id="measureDate" type="date" class="form-input" value="${selected}"></div><div style="display:flex;align-items:end"><button class="btn btn-primary btn-block" data-action="save-measure">${ico('save',15)} Salvar medida</button></div></div>${lastMeasure?`<p class="small-note" style="margin:13px 0 0">Última medição: ${lastMeasure.weight!==null?`${fmt(lastMeasure.weight)} kg`:'—'} · ${lastMeasure.waist!==null?`${fmt(lastMeasure.waist)} cm`:'—'} em ${fullDate(lastMeasure.date)}.</p>`:''}${m.length?`<div class="divider"></div>${m.slice(0,12).map(o=>`<div class="measure-line"><div><strong>${fullDate(o.date)}</strong><div class="text-muted micro">${o.weight!==null?fmt(o.weight)+' kg':'—'} • ${o.waist!==null?fmt(o.waist)+' cm':'—'}</div></div><button class="icon-btn" data-action="delete-measure" data-date="${o.date}" aria-label="Excluir medida de ${fullDate(o.date)}">${ico('trash',16)}</button></div>`).join('')}`:''}</div><div class="section-head"><h2 class="section-title">Interpretação</h2></div><div class="message">Não use só o peso da balança. Procure aumento progressivo de força, mais fôlego nos rolas, melhora nas medidas e recuperação adequada. Definição depende também de alimentação e sono.</div>`}
function pageSettings(){return `<div class="tab-top"><span class="eyebrow">PERSONALIZAÇÃO & DADOS</span><h1 class="page-title">Ajustes</h1><p class="subtext">Controle seu ciclo, mantenha o histórico no dispositivo e faça backups.</p></div><div class="card"><div class="flex-between"><h2 class="section-title">Início das 8 semanas</h2>${ico('calendar',19)}</div><p class="subtext">A data deve ser uma segunda-feira. O programa ajusta as séries automaticamente conforme a fase.</p><label class="form-label" for="startDate">Primeira segunda-feira do ciclo</label><input id="startDate" class="form-input" type="date" value="${x(db.startDate)}"><button class="btn btn-primary btn-block" style="margin-top:13px" data-action="save-start">${ico('save',17)} Salvar data de início</button><p class="small-note" style="margin:11px 0 0">Alterar a data não apaga registros; apenas recalcula em que semana cada data se encontra.</p></div><div class="section-head"><h2 class="section-title">Progressão planejada</h2></div><div class="card">${[{id:'1–2',title:'Adaptação',desc:'Redução de uma série por exercício. Cardio leve, sem HIIT.'},{id:'3–4',title:'Construção',desc:'Séries completas. Sábado: até 4 ciclos de 30 segundos fortes e 90 leves.'},{id:'5',title:'Recuperação',desc:'Metade das séries. Sem intervalos intensos.'},{id:'6–8',title:'Evolução',desc:'Séries completas. Sábado: até 6 ciclos, conforme recuperação.'}].map(t=>`<div class="phase"><div class="phase-num">${t.id}</div><div><strong>${t.title}</strong><p>${t.desc}</p></div></div>`).join('')}</div><div class="section-head"><h2 class="section-title">Seus dados</h2></div><div class="card"><span class="tag ${storageGood?'green':'amber'}">${storageGood?'Salvamento local ativo':'Armazenamento indisponível'}</span><p class="subtext">O app salva automaticamente neste navegador/aparelho. Ele não sincroniza entre celulares e não envia dados para servidores. Exporte backups regularmente, especialmente no iPhone.</p><div class="file-actions"><button class="btn btn-secondary" data-action="export">${ico('download',17)} Exportar backup</button><button class="btn btn-outline" data-action="import">${ico('refresh',17)} Importar backup</button></div><div class="divider"></div><button class="btn btn-danger btn-block" data-action="reset">${ico('trash',16)} Apagar todos os registros</button><p class="small-note">Dica: guarde o arquivo JSON de backup no app Arquivos/iCloud Drive. Limpar dados do navegador pode apagar este histórico.</p></div><p class="footnote">Planejamento geral de condicionamento, não substitui avaliação presencial de técnica ou orientação médica. Ajuste volume se o jiu-jitsu estiver muito intenso, e interrompa movimentos que causem dor.</p>`}
function render(scrollTop=false){document.getElementById('topDate').innerHTML=`PLANO DE 8 SEMANAS<strong>${dateFull(today)}</strong>`;renderNav();let map={today:pageToday,workout:pageWorkout,mob:pageMob,progress:pageProgress,settings:pageSettings};let y=window.scrollY;document.getElementById('view').innerHTML=map[tab]();if(scrollTop)window.scrollTo({top:0,behavior:'instant'});else requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}))}
function toast(s,error=false){const el=document.getElementById('toast');el.textContent=s;el.style.background=error?'#ffe1dc':'#dff8ed';el.style.color=error?'#722c22':'#11352e';el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3000)}
function setTab(t){tab=t;render(true)}
function reselectDate(d){selected=d;expanded={};render(false)}
function confirmAction(m){return window.confirm(m)}
function timerUI(){const bar=document.getElementById('timerBar');if(!timer){bar.style.display='none';return}bar.style.display='flex';document.getElementById('timerName').textContent=timer.label;document.getElementById('timerDisplay').textContent=`${String(Math.floor(timer.seconds/60)).padStart(2,'0')}:${String(timer.seconds%60).padStart(2,'0')}`;document.getElementById('pauseTimer').textContent=timer.running?'Pausar':'Continuar'}
function timerStart(sec,label){if(tick)clearInterval(tick);timer={seconds:Math.max(1,Math.floor(sec)),label,running:true};timerUI();tick=setInterval(()=>{if(!timer||!timer.running)return;timer.seconds=Math.max(0,timer.seconds-1);timerUI();if(timer.seconds===0){timer.running=false;clearInterval(tick);tick=null;toast('Temporizador concluído!');if('vibrate' in navigator)try{navigator.vibrate([100,90,100])}catch(e){}}},1000)}
function finishGym(){let d=dayData();d.gymDone=!d.gymDone;save();toast(d.gymDone?'Treino de força concluído!':'Treino marcado como pendente');render(false)}
function finishJiu(){let d=dayData();d.jiuDone=!d.jiuDone;save();toast(d.jiuDone?'Sessão de jiu registrada!':'Sessão marcada como pendente');render(false)}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`atleta-jiu-backup-${today}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Backup exportado. Guarde o arquivo em lugar seguro.')}
function restore(file){if(!file)return;let rd=new FileReader();rd.onload=()=>{try{let d=JSON.parse(String(rd.result));if(!d||typeof d!=='object'||!d.days||!Array.isArray(d.measurements)||!/^\d{4}-\d{2}-\d{2}$/.test(d.startDate))throw Error('Estrutura inválida');if(!confirmAction('Importar este backup vai SUBSTITUIR todos os dados atuais. Continuar?'))return;db={...initial(),...d};save();render(true);toast('Backup importado com sucesso!')}catch(e){toast('Arquivo de backup inválido.',true)}};rd.onerror=()=>toast('Não foi possível abrir o arquivo.',true);rd.readAsText(file)}
function changeField(el){let kind=el.dataset.field,d=dayData(),val=el.type==='checkbox'?el.checked:el.value;if(kind==='lift'){let ar=d.lifts[el.dataset.ex];if(!ar||!ar[Number(el.dataset.idx)])return;ar[Number(el.dataset.idx)][el.dataset.prop]=val;if(el.dataset.prop==='done'){save();render(false);return}}else if(kind==='mob'){d.mob[el.dataset.id]=val;save();render(false);return}else if(kind==='jiu'){d.jiu[el.dataset.prop]=val}else if(kind==='cardio'){d.cardio[el.dataset.prop]=val;if(el.dataset.prop==='done'){save();render(false);return}}save()}
function clickAction(btn){let a=btn.dataset.action;if(a==='tab')return setTab(btn.dataset.tab);if(a==='date')return reselectDate(btn.dataset.date);if(a==='today')return reselectDate(today);if(a==='weekprev')return reselectDate(addDays(selected,-7));if(a==='weeknext')return reselectDate(addDays(selected,7));if(a==='toggle-ex'){let id=btn.dataset.id;expanded[id]=expanded[id]===false?true:false;return render(false)}if(a==='complete-gym')return finishGym();if(a==='complete-jiu')return finishJiu();if(a==='timer')return timerStart(Number(btn.dataset.secs),btn.dataset.label||'Temporizador');if(a==='timer-pause'){if(timer)timer.running=!timer.running;return timerUI()}if(a==='timer-close'){timer=null;if(tick)clearInterval(tick);tick=null;return timerUI()}if(a==='all-mob'){const d=dayData();mobility.forEach(m=>d.mob[m.id]=true);save();render(false);return toast('Mobilidade completa!')}if(a==='clear-mob'){const d=dayData();mobility.forEach(m=>d.mob[m.id]=false);save();return render(false)}if(a==='go-week')return reselectDate(addDays(db.startDate,(Number(btn.dataset.week)-1)*7));if(a==='export')return backup();if(a==='import')return document.getElementById('fileImport').click();if(a==='reset'){if(confirmAction('Apagar definitivamente TODOS os registros de treinos, cardio, mobilidade e medidas?')){if(confirmAction('Última confirmação: exportou seu backup? Esta ação não pode ser desfeita.')){db=initial();selected=today;save();render(true);toast('Registros apagados.')}}return}if(a==='save-start'){let v=document.getElementById('startDate').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(v)||weekday(v)!==1){toast('Selecione uma segunda-feira válida.',true);return}db.startDate=v;save();render(false);toast('Início do ciclo atualizado!');return}if(a==='save-measure'){let wi=document.getElementById('bodyWeight').value.trim(),wa=document.getElementById('waist').value.trim(),date=document.getElementById('measureDate').value,w=wi?num(wi):null,c=wa?num(wa):null;if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date)||(!wi&&!wa)||w!==null&&(w<=0||w>400)||c!==null&&(c<=0||c>250)){toast('Informe data e ao menos uma medida válida.',true);return}db.measurements=db.measurements.filter(m=>m.date!==date);db.measurements.push({date,weight:w,waist:c});save();render(false);toast('Medidas registradas!');return}if(a==='delete-measure'){if(confirmAction('Excluir a medição deste dia?')){db.measurements=db.measurements.filter(m=>m.date!==btn.dataset.date);save();render(false);toast('Medição excluída.')}return}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.tagName==='SELECT')return;clickAction(b)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('ex-top')){e.preventDefault();clickAction(e.target)}});
document.addEventListener('input',e=>{if(e.target.dataset.field&&e.target.type!=='checkbox')changeField(e.target)});
document.addEventListener('change',e=>{if(e.target.id==='liftSelect'){selectedLift=e.target.value;render(false);return}if(e.target.dataset.field)changeField(e.target)});
document.getElementById('fileImport').addEventListener('change',e=>{restore(e.target.files[0]);e.target.value=''});
// Initializes once. All logs persist locally and can be exported as JSON.
render(true);
})();
</script>
</body>
</html>
